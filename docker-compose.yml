# Harker's Archive — helsings_round on a VPS (or any host).
#
# Setup:
#   cp .env.example .env   # TELEGRAM_BOT_TOKEN, etc. — never commit .env
#   mkdir -p voice_archive transcripts dossier logs rainfields_mind/weekly
#   docker compose up -d --build
#
# Archive folders are bind-mounted to ./ on the host (outside the container).
# Stop any other helsings_round / bot.py using the same Telegram token first.

services:
  helsings-round:
    build: .
    container_name: harkers-archive
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
    environment:
      SAVE_DIR: /app/voice_archive
      TRANSCRIPTS_DIR: /app/transcripts
      HARKERS_INPUT_DIR: /app/voice_archive
      HARKERS_OUTPUT_DIR: /app/transcripts
      HARKERS_TRANSCRIPTS_DIR: /app/transcripts
      HARKERS_DOSSIER_DIR: /app/dossier
      HARKERS_RAINFIELDS_DIR: /app/rainfields_mind
      HELSINGS_HTTP_LOG: /app/logs/helsings_round_http.log
      # Reach pgvector-db on the external postgres_default network (overrides host .env localhost URL).
      HARKERS_DATABASE_URL: postgresql://guilherme:postgui123@pgvector-db:5432/harkers
      QUINCEYS_DISPATCH_ENABLED: ${QUINCEYS_DISPATCH_ENABLED:-true}
    volumes:
      - ./voice_archive:/app/voice_archive
      - ./transcripts:/app/transcripts
      - ./dossier:/app/dossier
      - ./rainfields_mind:/app/rainfields_mind
      - ./logs:/app/logs
    networks:
      - default
      - postgres

networks:
  postgres:
    external: true
    name: postgres_default
