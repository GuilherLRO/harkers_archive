# Harker's Archive — Syncthing + optional helsings_round coordinator.
#
# Setup: cp .env.example .env (secrets never committed)
#
# Main Mac (sync data only):
#   docker compose up -d
#
# Remote machine (run bot + sync with main):
#   Add COMPOSE_PROFILES=runner to .env
#   docker compose up -d --build
#   Stop helsings_round on main first — one Telegram token, one poller.
#
# Pair Syncthing at http://localhost:8384 on each machine (see README § Docker).

services:
  syncthing:
    image: syncthing/syncthing:2
    container_name: harkers-syncthing
    restart: unless-stopped
    hostname: ${SYNCTHING_HOSTNAME:-harkers-archive}
    environment:
      STGUIADDRESS: 0.0.0.0:8384
    volumes:
      - syncthing-config:/var/syncthing/config
      - ./voice_archive:/data/voice_archive
      - ./transcripts:/data/transcripts
      - ./dossier:/data/dossier
      - ./logs:/data/logs
      - ./rainfields_mind/weekly:/data/rainfields_mind/weekly
    ports:
      - "${SYNCTHING_GUI_PORT:-8384}:8384"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/udp"

  helsings-round:
    profiles: [runner]
    build: .
    container_name: harkers-archive
    restart: unless-stopped
    init: true
    depends_on:
      syncthing:
        condition: service_started
    env_file:
      - path: .env
        required: true
    environment:
      SAVE_DIR: /app/voice_archive
      TRANSCRIPTS_DIR: /app/transcripts
      HARKERS_INPUT_DIR: /app/voice_archive
      HARKERS_OUTPUT_DIR: /app/transcripts
      HARKERS_TRANSCRIPTS_DIR: /app/transcripts
      HARKERS_DOSSIER_DIR: /app/dossier
      HARKERS_RAINFIELDS_DIR: /app/rainfields_mind
      HELSINGS_HTTP_LOG: /app/logs/helsings_round_http.log
    volumes:
      - ./voice_archive:/app/voice_archive
      - ./transcripts:/app/transcripts
      - ./dossier:/app/dossier
      - ./rainfields_mind:/app/rainfields_mind
      - ./logs:/app/logs
      - whisper-cache:/root/.cache/whisper

volumes:
  syncthing-config:
  whisper-cache:
