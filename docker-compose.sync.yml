# Main machine: Syncthing only — mirrors archive data to a remote runner (docker-compose.remote.yml).
#
# Does NOT start helsings_round. Keep using helsings_roundctl.sh here, OR stop it and run
# the bot on the remote machine instead (never both).
#
# Setup:
#   docker compose -f docker-compose.sync.yml up -d
#   Open http://127.0.0.1:8384 — pair with remote Syncthing, share the same folders.

services:
  syncthing:
    image: syncthing/syncthing:2
    container_name: harkers-syncthing-main
    restart: unless-stopped
    hostname: ${SYNCTHING_HOSTNAME:-harkers-main}
    environment:
      STGUIADDRESS: 0.0.0.0:8384
    volumes:
      - syncthing-config:/var/syncthing/config
      - ./voice_archive:/data/voice_archive
      - ./transcripts:/data/transcripts
      - ./dossier:/data/dossier
      - ./logs:/data/logs
      - ./rainfields_mind/weekly:/data/rainfields_mind/weekly
    ports:
      - "127.0.0.1:${SYNCTHING_GUI_PORT:-8384}:8384"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/udp"

volumes:
  syncthing-config:
