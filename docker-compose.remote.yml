# Remote machine: run helsings_round + Syncthing to mirror archive data from your main Mac.
#
# On the MAIN machine (source of truth for files): use docker-compose.sync.yml instead.
# Run ONLY ONE helsings_round (here OR on main — same Telegram token).
#
# Setup:
#   git clone … && cd harkers_archive
#   cp .env.example .env    # copy secrets from main via a secure channel (not Syncthing)
#   docker compose -f docker-compose.remote.yml up -d --build
#   Open http://<remote-ip>:8384 — pair with main Syncthing, share folders (see docs/DOCKER_REMOTE.md)

include:
  - path: docker-compose.yml

services:
  syncthing:
    image: syncthing/syncthing:2
    container_name: harkers-syncthing
    restart: unless-stopped
    hostname: ${SYNCTHING_HOSTNAME:-harkers-remote}
    environment:
      STGUIADDRESS: 0.0.0.0:8384
    volumes:
      - syncthing-config:/var/syncthing/config
      - ./voice_archive:/data/voice_archive
      - ./transcripts:/data/transcripts
      - ./dossier:/data/dossier
      - ./logs:/data/logs
      - ./rainfields_mind/weekly:/data/rainfields_mind/weekly
    ports:
      - "${SYNCTHING_GUI_PORT:-8384}:8384"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_SYNC_PORT:-22000}:22000/udp"
    # Prefer Tailscale/private LAN; do not expose 8384 to the public internet without auth.

  helsings-round:
    depends_on:
      syncthing:
        condition: service_started

volumes:
  syncthing-config:
